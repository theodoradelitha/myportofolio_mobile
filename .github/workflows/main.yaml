name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # CI: generate code, check formatting, analyze, and run the tests.
  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v2
    with:
      # *.g.dart files are not committed, so generate them first.
      setup: dart run build_runner build --delete-conflicting-outputs
      coverage_excludes: "**/*.g.dart"
      min_coverage: 0
      timeout_minutes: 15

  # CD: build a release APK once CI has passed.
  build_apk:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate JSON serialization code
        run: dart run build_runner build --delete-conflicting-outputs

      # Without --dart-define=API_BASE_URL=..., the APK talks to
      # http://10.0.2.2:8000 (the host computer, seen from an Android emulator).
      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
